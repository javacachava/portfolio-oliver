services:
  portfolio-oliver-web:
    build: .
    container_name: portfolio-oliver-web
    restart: unless-stopped
    networks:
      - proxy

# Red externa del proxy Caddy compartido en el VPS: no la creamos ni
# gestionamos nosotros, solo nos unimos para que Caddy (unico dueno de
# :80/:443 en este VPS) pueda alcanzarnos como "portfolio-oliver-web:3000".
networks:
  proxy:
    external: true
