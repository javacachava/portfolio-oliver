name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd /srv/team/oliver-portfolio

            # Pull latest changes
            git pull origin main

            # Reconstruye la imagen y reinicia el contenedor (se conecta a
            # la red externa de Caddy compartida; no toca otros proyectos)
            docker compose up -d --build

            echo "Deploy completado: $(date)"
