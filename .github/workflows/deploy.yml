name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd /srv/portfolios/oliver

            # Trae los últimos cambios (repositorio público, clon por https)
            git pull --ff-only origin main

            # Reconstruye la imagen y reinicia el contenedor `portfolio-oliver-web`
            # (se conecta a la red externa `proxy` de Caddy; no toca otros proyectos).
            # Requiere que el usuario ubuntu pertenezca al grupo docker.
            docker compose up -d --build

            echo "Deploy completado: $(date)"
