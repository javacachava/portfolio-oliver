<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>POS para restaurante — Demo interactivo</title>
</head>
<body>
<style>
  /* ═══ Tokens — tema Carbón, copiados de resources/css/app.css del POS ═══ */
  :root {
    color-scheme: dark;
    --bg: #1f2030;
    --surface: #2a2b40;
    --raised: #353756;
    --border: #3e4168;
    --border-bright: #545a86;
    --tp: #f2f4f7;
    --ts: #9aa4b2;
    --tm: #7b87a0;
    --primary: #f59e0b;
    --primary-h: #fbbf24;
    --on-primary: #1a1009;
    --secondary: #818cf8;
    --cash: #2f6bff;
    --cash-h: #5285ff;
    --success: #34d399;
    --danger: #f87171;
    --warning: #fbbf24;
    --info: #60a5fa;
    --primary-rgb: 245 158 11;
    --success-rgb: 52 211 153;
    --danger-rgb: 248 113 113;
    --warning-rgb: 251 191 36;
    --info-rgb: 96 165 250;
    --cash-rgb: 47 107 255;
    --secondary-rgb: 129 140 248;
    --glow-primary: rgba(245, 158, 11, 0.25);
    --glow-success: rgba(52, 211, 153, 0.2);
    --glow-danger: rgba(248, 113, 113, 0.2);
    --glow-cash: rgba(47, 107, 255, 0.22);
    --gutter: clamp(12px, 4vw, 24px);
    --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--tp);
    font-family: var(--font);
    font-feature-settings: 'cv11', 'ss01', 'zero';
    font-size: 15px;
    line-height: 1.47;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; cursor: pointer; border: none; color: inherit; background: none; padding: 0; }
  button:disabled { cursor: not-allowed; opacity: 0.4; }
  input { font: inherit; }
  *:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(var(--primary-rgb) / 0.5); }
  ::selection { background: rgba(var(--primary-rgb) / 0.25); color: var(--tp); }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 9999px; }
  h1, h2, h3 { margin: 0; }
  p { margin: 0; }
  .ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ic-sm { width: 13px; height: 13px; }
  .ic-lg { width: 20px; height: 20px; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* ═══ Botones (réplica @layer components del POS) ═══ */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: clamp(4px, 1.2vw, 8px);
    min-height: 48px; min-width: 48px;
    padding: clamp(8px, 0.4rem + 0.5vw, 11px) clamp(12px, 0.6rem + 1.1vw, 20px);
    border-radius: 16px;
    font-size: 14px; font-weight: 600;
    user-select: none;
    transition: all 0.15s;
  }
  .btn:active:not(:disabled) { transform: scale(0.96); }
  .btn-primary {
    background: var(--primary); color: var(--on-primary);
    box-shadow: 0 2px 12px var(--glow-primary), 0 1px 0 rgba(255, 255, 255, 0.1) inset;
  }
  .btn-primary:hover:not(:disabled) { background: var(--primary-h); box-shadow: 0 4px 20px var(--glow-primary), 0 1px 0 rgba(255,255,255,0.12) inset; transform: translateY(-1px); }
  .btn-cash { background: var(--cash); color: #fff; box-shadow: 0 2px 12px var(--glow-cash); }
  .btn-cash:hover:not(:disabled) { background: var(--cash-h); box-shadow: 0 4px 20px var(--glow-cash); transform: translateY(-1px); }
  .btn-success { background: var(--success); color: #fff; box-shadow: 0 2px 12px var(--glow-success); }
  .btn-success:hover:not(:disabled) { box-shadow: 0 4px 20px var(--glow-success); transform: translateY(-1px); }
  .btn-danger { background: var(--danger); color: #fff; box-shadow: 0 2px 12px var(--glow-danger); }
  .btn-outline { border: 1px solid var(--border-bright); background: transparent; color: var(--ts); }
  .btn-outline:hover:not(:disabled) { background: var(--raised); color: var(--tp); border-color: var(--tm); }
  .btn-ghost { background: transparent; color: var(--ts); }
  .btn-ghost:hover:not(:disabled) { background: var(--raised); color: var(--tp); }
  .btn-block { width: 100%; }
  .btn-sm { min-height: 36px; min-width: 0; padding: 6px 12px; font-size: 12px; border-radius: 10px; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 12px; flex: none;
    color: var(--ts); transition: all 0.15s;
  }
  .icon-btn:hover { background: var(--raised); color: var(--tp); }

  /* ═══ Cards / inputs / chips ═══ */
  .card {
    border-radius: 16px; border: 1px solid var(--border);
    padding: clamp(12px, 0.6rem + 1.6vw, 20px);
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
  }
  .input {
    min-height: 44px; width: 100%; border-radius: 12px; font-size: 14px;
    padding: 10px 14px;
    background: var(--raised);
    border: 1.5px solid var(--border-bright);
    color: var(--tp);
    transition: all 0.15s;
  }
  .input::placeholder { color: var(--tm); }
  .input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(var(--primary-rgb) / 0.18); }
  .label-xs {
    display: block; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--tm);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    border-radius: 9999px; padding: 3px 10px;
    font-size: 11px; font-weight: 700;
  }
  .vdiv { width: 1px; height: 20px; background: var(--border-bright); flex: none; }

  /* ═══ Header de app (réplica WaiterLayout) ═══ */
  .app-hdr {
    position: relative; z-index: 30;
    display: flex; align-items: center; gap: 10px;
    min-height: 56px; padding: 6px var(--gutter);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .hdr-brand { display: flex; align-items: center; gap: 10px; margin-right: 4px; }
  .logo-sq {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 12px; flex: none;
    background: var(--primary);
    box-shadow: 0 2px 10px var(--glow-primary);
    color: #fff;
  }
  .logo-badge {
    position: absolute; right: -6px; top: -6px;
    display: flex; align-items: center; justify-content: center;
    height: 18px; min-width: 18px; padding: 0 3px;
    border-radius: 9999px;
    background: var(--danger); color: #fff;
    font-size: 10px; font-weight: 900;
    box-shadow: 0 0 0 2px var(--surface);
    animation: bounce 1s infinite;
  }
  @keyframes bounce { 0%, 100% { transform: translateY(-15%); } 50% { transform: translateY(0); } }
  .biz-name { font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
  @media (max-width: 720px) { .biz-name { display: none; } }

  .role-nav { display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .role-nav::-webkit-scrollbar { display: none; }
  .role-pill {
    position: relative;
    display: flex; align-items: center; gap: 6px; flex: none;
    min-height: 44px; padding: 6px 12px;
    border-radius: 12px;
    font-size: 13.5px; font-weight: 600; color: var(--ts);
    white-space: nowrap;
    transition: all 0.15s;
  }
  .role-pill:hover:not(.on) { background: var(--raised); color: var(--tp); }
  .role-pill.on { background: var(--primary); color: #fff; box-shadow: 0 2px 10px var(--glow-primary); }
  .role-pill .n {
    display: flex; align-items: center; justify-content: center;
    height: 18px; min-width: 18px; padding: 0 4px; border-radius: 9999px;
    font-size: 10px; font-weight: 900; color: #fff;
    background: var(--danger); box-shadow: 0 2px 6px var(--glow-danger);
  }
  .role-pill.on .n { background: rgba(255, 255, 255, 0.3); box-shadow: none; }
  .role-pill .n:empty { display: none; }
  @media (max-width: 640px) { .role-pill span.lbl { display: none; } .role-pill { padding: 6px 10px; } }

  .hdr-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .ws-pill {
    display: flex; align-items: center; gap: 6px;
    border-radius: 9999px; padding: 5px 10px;
    font-size: 11px; font-weight: 700;
    background: rgba(var(--success-rgb) / 0.15); color: var(--success);
  }
  .ws-pill .wsdot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  @media (max-width: 560px) { .ws-pill span.lbl { display: none; } }
  .demo-chip {
    border-radius: 9999px; padding: 4px 10px;
    font-size: 10px; font-weight: 800; letter-spacing: 0.1em;
    background: rgba(var(--primary-rgb) / 0.15); color: var(--primary-h);
    border: 1px solid rgba(var(--primary-rgb) / 0.35);
    white-space: nowrap;
  }
  .user-chip {
    display: flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 4px 10px 4px 4px; border-radius: 12px;
    transition: background 0.15s;
  }
  .user-chip:hover { background: var(--raised); }
  .avatar {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 8px; flex: none;
    background: linear-gradient(145deg, #818cf8, #6366f1);
    color: #fff; font-size: 11px; font-weight: 900;
  }
  .user-chip .uname { font-size: 13px; font-weight: 600; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 860px) { .user-chip .uname, .user-chip .ic { display: none; } }

  /* ═══ Contenido ═══ */
  .stage { flex: 1; width: 100%; overflow-y: auto; padding-bottom: 76px; }
  .view { max-width: 1180px; margin: 0 auto; padding: clamp(12px, 0.6rem + 1.6vw, 24px) var(--gutter); }
  .view-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .view-toolbar h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
  .count-chip { border-radius: 9999px; background: var(--raised); padding: 2px 10px; font-size: 12px; font-weight: 600; color: var(--tm); }
  .toolbar-hint { margin-left: auto; font-size: 12px; color: var(--tm); }
  @media (max-width: 700px) { .toolbar-hint { display: none; } }

  .auto-grid { display: grid; gap: clamp(8px, 2.2vw, 12px); grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--col, 14rem)), 1fr)); }

  .sec-label {
    display: flex; align-items: center; gap: 8px;
    margin: 22px 0 10px;
    font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--tm);
  }
  .sec-label .ic { color: var(--primary); }
  .sec-label:first-child { margin-top: 0; }

  .empty-state {
    grid-column: 1 / -1;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    border-radius: 20px; padding: 44px 20px;
    background: var(--surface); border: 1.5px solid var(--border);
    text-align: center;
  }
  .empty-state .ic { width: 40px; height: 40px; color: var(--tm); opacity: 0.4; stroke-width: 1.5; }
  .empty-state b { font-size: 14px; color: var(--tp); }
  .empty-state p { font-size: 12px; color: var(--tm); }

  /* ═══ Mesa card (réplica MesaCard.vue) ═══ */
  .mesa-card {
    position: relative;
    display: flex; flex-direction: column;
    text-align: left; overflow: hidden; user-select: none;
    min-height: 112px; padding: clamp(10px, 1.2vw, 14px);
    border-radius: 18px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    transition: all 0.2s;
  }
  .mesa-card:active { transform: scale(0.96); }
  .mesa-card:hover { box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); }
  .mesa-libre:hover { border-color: rgba(249, 115, 22, 0.3); }
  .mesa-activa {
    border-color: rgba(249, 115, 22, 0.5);
    background: linear-gradient(145deg, var(--surface) 0%, rgba(249, 115, 22, 0.04) 100%);
    box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.12), 0 4px 20px rgba(249, 115, 22, 0.12);
  }
  .mesa-lista {
    border-color: rgba(34, 197, 94, 0.5);
    background: linear-gradient(145deg, var(--surface) 0%, rgba(34, 197, 94, 0.05) 100%);
    box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.15), 0 4px 20px rgba(34, 197, 94, 0.18);
  }
  .mesa-cuenta {
    border-color: rgba(234, 179, 8, 0.5);
    background: linear-gradient(145deg, var(--surface) 0%, rgba(234, 179, 8, 0.04) 100%);
    box-shadow: 0 0 0 1px rgba(234, 179, 8, 0.15), 0 4px 20px rgba(234, 179, 8, 0.15);
  }
  .mc-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
  .mc-name { font-size: 15px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
  .mc-name.free { color: var(--tm); }
  .mc-status { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
  .mc-bottom { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 4px 4px; margin-top: auto; padding-top: 8px; }
  .mc-cap { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--tm); }
  .mc-cap .ic { width: 12px; height: 12px; }
  .mc-open-pill {
    display: flex; align-items: center; gap: 2px; white-space: nowrap;
    border-radius: 9999px; padding: 2px 8px;
    font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em;
    background: var(--primary); color: var(--on-primary);
  }
  .mc-open-pill .ic { width: 12px; height: 12px; }
  .mc-right { text-align: right; }
  .mc-total { font-size: 14px; font-weight: 900; line-height: 1; }
  .mc-time { display: flex; align-items: center; justify-content: flex-end; gap: 3px; margin-top: 3px; font-size: 10px; color: var(--tm); }
  .mc-time.hot { font-size: 11px; font-weight: 900; }
  .mc-time .ic { width: 10px; height: 10px; }
  .ping-wrap { position: relative; display: flex; width: 10px; height: 10px; flex: none; }
  .ping-wrap .ping { position: absolute; inset: 0; border-radius: 50%; opacity: 0.6; animation: ping 1.2s cubic-bezier(0, 0, 0.2, 1) infinite; }
  .ping-wrap .pdot { position: relative; width: 10px; height: 10px; border-radius: 50%; }
  @keyframes ping { 75%, 100% { transform: scale(2.1); opacity: 0; } }
  .sdot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 1px; }

  /* ═══ Pedido (réplica PedidoView + CatalogPanel + ProductoCard + ItemPedido) ═══ */
  .pedido-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
  @media (max-width: 920px) { .pedido-grid { grid-template-columns: 1fr; } }
  .search-wrap { position: relative; margin-bottom: 10px; }
  .search-wrap .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--tm); width: 14px; height: 14px; }
  .search-wrap .input { padding-left: 34px; }
  .cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; scrollbar-width: thin; }
  .cat-pill {
    flex: none; white-space: nowrap;
    border-radius: 9999px; padding: 7px 13px; min-height: 34px;
    font-size: 12px; font-weight: 700;
    color: var(--ts); background: var(--surface); border: 1px solid var(--border);
    transition: all 0.15s;
  }
  .cat-pill:hover { color: var(--tp); }
  .cat-pill.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); box-shadow: 0 2px 10px var(--glow-primary); }

  .producto-card {
    position: relative;
    display: flex; flex-direction: column;
    overflow: hidden; text-align: left; user-select: none;
    padding: 9px; min-height: 56px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    transition: all 0.15s;
  }
  .producto-card:active { transform: scale(0.94); }
  .producto-card:hover {
    border-color: rgba(var(--primary-rgb) / 0.4);
    box-shadow: 0 4px 16px rgba(var(--primary-rgb) / 0.1);
    background: linear-gradient(145deg, var(--surface), rgba(var(--primary-rgb) / 0.03));
  }
  .pc-img {
    display: flex; align-items: center; justify-content: center;
    margin: -9px -9px 6px; height: 46px;
    background: var(--raised); overflow: hidden;
  }
  .pc-img .ic { width: 20px; height: 20px; color: var(--tm); opacity: 0.3; }
  .pc-name {
    flex: 1; margin-bottom: 6px;
    font-size: 12.5px; font-weight: 600; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pc-foot { display: flex; align-items: center; justify-content: space-between; }
  .pc-price { font-size: 13px; font-weight: 900; color: var(--primary); }
  .pc-plus {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(var(--primary-rgb) / 0.12); color: var(--primary);
  }
  .pc-plus .ic { width: 14px; height: 14px; }
  .pc-qty {
    position: absolute; right: 6px; top: 6px; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    height: 22px; min-width: 22px; padding: 0 6px; border-radius: 9999px;
    font-size: 11px; font-weight: 900;
    background: var(--primary); color: var(--on-primary);
    box-shadow: 0 2px 8px var(--glow-primary);
  }
  .pc-flash {
    position: absolute; inset: 0; z-index: 6;
    display: flex; align-items: center; justify-content: center;
    background: rgba(var(--success-rgb) / 0.15);
    animation: flashfade 0.7s ease forwards;
  }
  .pc-flash > div {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--success); color: #fff;
    box-shadow: 0 4px 16px rgba(var(--success-rgb) / 0.5);
  }
  @keyframes flashfade { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

  .orden-panel { position: sticky; top: 12px; }
  @media (max-width: 920px) { .orden-panel { position: static; } }
  .orden-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .orden-h h3 { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ts); }
  .orden-h .onum { font-family: var(--mono); font-size: 12px; color: var(--tm); }
  .orden-items { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; padding-right: 2px; }
  .oi {
    display: flex; align-items: center; gap: 10px; overflow: hidden;
    border-radius: 12px;
    background: var(--raised); border: 1px solid var(--border);
  }
  .oi-bar { width: 4px; align-self: stretch; flex: none; border-radius: 12px 0 0 12px; }
  .oi-info { flex: 1; min-width: 0; padding: 9px 0; }
  .oi-name-row { display: flex; align-items: center; gap: 6px; }
  .oi-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .oi-pill { flex: none; border-radius: 9999px; padding: 1px 7px; font-size: 10px; font-weight: 700; }
  .oi-unit { margin-top: 2px; font-size: 11px; color: var(--tm); }
  .oi-qtyc { display: flex; align-items: center; gap: 2px; flex: none; padding-right: 8px; }
  .oi-qtyc button {
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--border); color: var(--ts);
    transition: all 0.15s;
  }
  .oi-qtyc button:hover { color: var(--tp); }
  .oi-qtyc button:active { transform: scale(0.9); }
  .oi-qtyc .qn { width: 26px; text-align: center; font-size: 15px; font-weight: 900; }
  .oi-qty-fixed {
    display: flex; align-items: center; justify-content: center; flex: none;
    width: 30px; height: 30px; margin-right: 10px; border-radius: 10px;
    font-size: 13px; font-weight: 900;
  }
  .oi-sub { flex: none; padding-right: 10px; font-size: 13px; font-weight: 700; }
  .orden-total {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-top: 12px; padding-top: 12px;
    border-top: 1px dashed var(--border-bright);
    font-size: 13px; color: var(--ts);
  }
  .orden-total b { font-size: 22px; font-weight: 900; color: var(--tp); }
  .orden-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .orden-empty { padding: 26px 8px; text-align: center; font-size: 13px; color: var(--tm); }

  /* ═══ KDS (réplica KitchenView + KitchenBatchCard) ═══ */
  .kds-bar {

  /* ═══ Admin (réplica AdminLayout + AppSidebar + DashboardView) ═══ */

  .log-h h3 { font-size: 13.5px; font-weight: 700; }
  .log-modal ul { list-style: none; margin: 0; padding: 12px 18px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .log-modal li { display: flex; gap: 10px; font-family: var(--mono); font-size: 11.5px; color: var(--ts); }
  .log-modal li time { color: var(--tm); flex: none; font-variant-numeric: tabular-nums; }
  .log-modal li .ev { color: var(--info); }

  .toasts { position: fixed; top: 14px; right: 14px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 16px; border-radius: 12px;
    background: var(--raised); border: 1px solid var(--border-bright);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);

  }
  .toast .t-ic {
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%; flex: none;

  }
  .toast .t-ic .ic { width: 13px; height: 13px; }
  @keyframes tin { from { opacity: 0; transform: translateX(12px); } }

  .ticker {

    display: flex; align-items: center; gap: 10px;

  .ticker .wsdot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex: none; animation: pulse 2s infinite; }
  .ticker-label { flex: none; font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--tm); }
  .ticker-msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11px; }
  .ticker-msg .ev { color: var(--info); }
  .ticker button { flex: none; padding: 6px; font-size: 11.5px; color: var(--ts); text-decoration: underline; }
  @media (max-width: 560px) { .ticker-label { display: none; } }

  .mbar {

  /* ═══ Utilidades ═══ */
  function $(id) { return document.getElementById(id); }
  function fmt(c) { return '$' + (c / 100).toFixed(2); }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }
  function ic(name, cls) { return '<svg class="ic' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
  function itemsTotal(items) { return items.reduce(function (a, i) { return a + i.price * i.qty; }, 0); }
  function itemsCount(items) { return items.reduce(function (a, i) { return a + i.qty; }, 0); }
  function minsSince(t) { return t ? Math.max(0, Math.floor((Date.now() - t) / 60000)) : 0; }
  function mmss(sec) {
    if (sec < 3600) return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    return Math.floor(sec / 3600) + 'h ' + String(Math.floor((sec % 3600) / 60)).padStart(2, '0') + 'm';
  }

  function tableBatches(n) { return S.batches.filter(function (b) { return b.table === n; }); }
  // Estado efectivo del ticket (réplica de useOrderPresentation)
  function orderStatus(n) {
    var o = S.tables[n].order;
    if (!o) return 'libre';
    if (o.cuenta) return 'cuenta_solicitada';
    var bs = tableBatches(n);
    var active = bs.filter(function (b) { return b.status !== 'listo'; });
    if (active.length) return 'enviada';
    if (bs.some(function (b) { return b.status === 'listo'; })) return 'lista';
    if (o.items.some(function (i) { return i.sent; })) return 'lista';
    return 'abierta';
  }
  var EST = {
    libre:   { label: 'Libre',    color: 'var(--tm)',      live: false, card: 'mesa-libre' },
    abierta: { label: 'Abierta',  color: 'var(--primary)', live: false, card: 'mesa-activa' },
    enviada: { label: 'En cocina', color: 'var(--warning)', live: false, card: 'mesa-activa' },
    lista:   { label: 'Lista',    color: 'var(--success)', live: true,  card: 'mesa-lista' },
    cuenta_solicitada: { label: 'Cuenta', color: '#eab308', live: true, card: 'mesa-cuenta' }
  };
  function cobrable(n) {
    var o = S.tables[n].order;
    if (!o || !o.items.length) return false;
    if (o.items.some(function (i) { return !i.sent; })) return false;
    return tableBatches(n).every(function (b) { return b.status === 'listo'; }) || tableBatches(n).length === 0;
  }

  function registerSale(items, metodo) {
    var total = itemsTotal(items);
    S.ventas += total;
    S.tickets++;
    S.mtd[metodo] += total;
    S.salesWeek[6] = S.ventas;
    items.forEach(function (i) { S.sold[i.name] = (S.sold[i.name] || 0) + i.qty; });
    return total;
  }

  function pushEvent(ev, detail) {
    S.events.push({ at: new Date(), ev: ev, detail: detail });
    $('tickerMsg').innerHTML = '<span class="ev">' + esc(ev) + '</span> · ' + esc(detail);
  }
  function toast(msg) {
    var d = document.createElement('div');
    d.className = 'toast';
    d.innerHTML = '<span class="t-ic">' + ic('check') + '</span>' + esc(msg);
    $('toasts').appendChild(d);
    setTimeout(function () { d.remove(); }, 2800);
  }

  /* ═══ Sonido del KDS (réplica WebAudio de KitchenView) ═══ */
  var audioCtx = null;
  function tone(from, to, duration, volume) {
    if (!S.soundOn) return;
    try {
      audioCtx = audioCtx || new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(from, audioCtx.currentTime);
      osc.frequency.setValueAtTime(to, audioCtx.currentTime + duration * 0.3);
      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + duration);
    } catch (e) { /* sin audio */ }
  }
  function soundNewOrder() { tone(880, 1100, 0.4, 0.25); }
  function soundAdvance() { tone(660, 440, 0.18, 0.18); }

  /* ═══ Render raíz ═══ */
  function render() {
    // pills de rol + badges
    document.querySelectorAll('.role-pill').forEach(function (p) {
      p.classList.toggle('on', p.dataset.view === S.view);
    });
    var listas = Object.keys(S.tables).filter(function (n) { return orderStatus(+n) === 'lista'; }).length;
    var kdsPend = S.batches.filter(function (b) { return b.status !== 'listo'; }).length;
    var porLiq = S.deliveries.filter(function (d) { return d.status === 'entregada'; }).length;
    var cobrs = Object.keys(S.tables).filter(function (n) {
      var stt = orderStatus(+n);
      return (stt === 'lista' || stt === 'cuenta_solicitada') && cobrable(+n);
    }).length;
    var riderN = S.deliveries.filter(function (d) { return d.status !== 'entregada'; }).length;
    $('nMesero').textContent = listas || '';
    $('nCocina').textContent = kdsPend || '';
    $('nCaja').textContent = (cobrs + porLiq) || '';
    $('nRider').textContent = riderN || '';

    var lb = $('logoBadge');
    if (S.view === 'mesero' && listas > 0) { lb.hidden = false; lb.textContent = listas; }
    else lb.hidden = true;

    var u = USERS[S.view];
    $('uAvatar').textContent = u.name.split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
    $('uName').textContent = u.name.split(' ')[0];

    var p = $('panel');
    if (S.view === 'mesero') p.innerHTML = S.meseroScreen === 'mesas' ? vMesas() : vPedido();
    else if (S.view === 'cocina') p.innerHTML = vCocina();
    else if (S.view === 'caja') p.innerHTML = S.cajaCobro ? vCobro() : vCuentas();
    else if (S.view === 'rider') p.innerHTML = vRider();
    else p.innerHTML = vAdmin();

    renderMbar();
    if (S.view === 'admin') { drawDonutLegend(); requestAnimationFrame(drawCharts); }
  }

  /* ═══ MESERO — Pedido (réplica CatalogPanel + ProductoCard + ItemPedido) ═══ */
  function inOrderQty(name) {
    var o = S.activeTable && S.tables[S.activeTable].order;
    if (!o) return 0;
    return o.items.filter(function (i) { return i.name === name; }).reduce(function (a, i) { return a + i.qty; }, 0);

  /* ═══ COCINA — KDS (réplica KitchenView + KitchenBatchCard) ═══ */
  function batchVisual(b) {
    var sec = Math.floor((Date.now() - b.sentAt) / 1000);
    var border = b.status === 'pendiente' ? 'rgba(var(--danger-rgb) / 0.40)'
      : b.status === 'preparando' ? 'rgba(var(--warning-rgb) / 0.40)'
      : 'rgba(var(--success-rgb) / 0.40)';
    var glow = b.status === 'pendiente' ? 'rgba(var(--danger-rgb) / 0.08)'
      : b.status === 'preparando' ? 'rgba(var(--warning-rgb) / 0.07)'
      : 'rgba(var(--success-rgb) / 0.07)';
    var tcol = sec > 900 ? 'var(--danger)' : sec > 600 ? 'var(--warning)' : 'var(--ts)';
    var tbg = sec > 900 ? 'rgba(var(--danger-rgb) / 0.15)' : sec > 600 ? 'rgba(var(--warning-rgb) / 0.15)' : 'rgba(255,255,255,0.06)';
    return { sec: sec, border: border, glow: glow, tcol: tcol, tbg: tbg,
      delayed: b.status !== 'listo' && sec > 900,
      isNew: b.status === 'pendiente' && sec < 30 };
  }

  /* ═══ Charts canvas (estética ApexCharts del dashboard real) ═══ */
  var areaGeom = null;
  function setupCanvas(cv, hCss) {
    var ctx = cv.getContext && cv.getContext('2d');
    if (!ctx) return null;
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || cv.parentElement.clientWidth || 320;
    cv.width = w * dpr; cv.height = hCss * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, w: w, h: hCss };
  }
  function drawCharts() {
    drawArea();
    drawDonut();
  }
  function dayLabels() {
    var names = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    var out = [], today = new Date().getDay();
    for (var i = 6; i >= 0; i--) out.push(names[(today - i + 7) % 7]);
    return out;
  }
  function drawArea() {
    var cv = $('chartArea');
    if (!cv) return;
    var c = setupCanvas(cv, 180);
    if (!c) return;
    var ctx = c.ctx;
    var data = S.salesWeek, labels = dayLabels();
    var padL = 40, padR = 12, padT = 14, padB = 24;
    var iw = c.w - padL - padR, ih = c.h - padT - padB;
    var maxV = Math.max.apply(null, data) * 1.15;
    var pts = data.map(function (v, i) {
      return { x: padL + iw * i / (data.length - 1), y: padT + ih * (1 - v / maxV), v: v };
    });
    areaGeom = { pts: pts, labels: labels, padT: padT, ih: ih };
    ctx.clearRect(0, 0, c.w, c.h);
    // grid punteado (strokeDashArray 4, como el real)
    ctx.strokeStyle = 'rgba(84, 90, 134, 0.35)';
    ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
    for (var g = 0; g <= 3; g++) {
      var gy = padT + ih * g / 3;
      ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(c.w - padR, gy); ctx.stroke();
      ctx.setLineDash([4, 4]);
      ctx.fillStyle = '#7b87a0'; ctx.font = '10px Inter, sans-serif'; ctx.textAlign = 'right';
      ctx.fillText('$' + Math.round(maxV * (1 - g / 3) / 100), padL - 6, gy + 3);
    }
    ctx.setLineDash([]);
    // curva suave (catmull-rom → bezier)
    function curve(close) {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (var i = 0; i < pts.length - 1; i++) {
        var p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
        ctx.bezierCurveTo(
          p1.x + (p2.x - p0.x) / 6, p1.y + (p2.y - p0.y) / 6,
          p2.x - (p3.x - p1.x) / 6, p2.y - (p3.y - p1.y) / 6,
          p2.x, p2.y);
      }
      if (close) {
        ctx.lineTo(pts[pts.length - 1].x, padT + ih);
        ctx.lineTo(pts[0].x, padT + ih);
        ctx.closePath();
      }
    }
    var grad = ctx.createLinearGradient(0, padT, 0, padT + ih);
    grad.addColorStop(0, 'rgba(245, 158, 11, 0.35)');
    grad.addColorStop(1, 'rgba(245, 158, 11, 0.02)');
    curve(true); ctx.fillStyle = grad; ctx.fill();
    curve(false); ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();
    // punto final enfatizado (hoy)
    var last = pts[pts.length - 1];
    ctx.beginPath(); ctx.arc(last.x, last.y, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = '#f59e0b'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#2a2b40'; ctx.stroke();
    // etiquetas x
    ctx.fillStyle = '#7b87a0'; ctx.font = '10px Inter, sans-serif'; ctx.textAlign = 'center';
    pts.forEach(function (p, i) { ctx.fillText(labels[i], p.x, c.h - 8); });

    // hover: crosshair + tooltip
    cv.onmousemove = function (ev) {
      var r = cv.getBoundingClientRect();
      var x = ev.clientX - r.left;
      var best = 0, bd = 1e9;
      pts.forEach(function (p, i) { var d = Math.abs(p.x - x); if (d < bd) { bd = d; best = i; } });
      drawArea();
      var ctx2 = cv.getContext('2d');
      var p = pts[best];
      ctx2.save();
      ctx2.strokeStyle = 'rgba(154, 164, 178, 0.4)'; ctx2.setLineDash([3, 3]); ctx2.lineWidth = 1;
      ctx2.beginPath(); ctx2.moveTo(p.x, padT); ctx2.lineTo(p.x, padT + ih); ctx2.stroke();
      ctx2.setLineDash([]);
      ctx2.beginPath(); ctx2.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx2.fillStyle = '#fbbf24'; ctx2.fill();
      ctx2.restore();
      var tip = $('areaTip');
      tip.style.display = 'block';
      tip.style.left = p.x + 'px';
      tip.style.top = (p.y - 6) + 'px';
      tip.innerHTML = labels[best] + ' · <b>' + fmt(p.v) + '</b>';
    };
    cv.onmouseleave = function () {
      var tip = $('areaTip');
      if (tip) tip.style.display = 'none';
      drawArea();
    };
  }
  function drawDonut() {
    var cv = $('chartDonut');
    if (!cv) return;
    var c = setupCanvas(cv, 170);
    if (!c) { drawDonutLegend(); return; }
    var ctx = c.ctx;
    var series = [
      { label: 'Efectivo', value: S.mtd.efectivo, color: '#f59e0b' },
      { label: 'Tarjeta', value: S.mtd.tarjeta, color: '#2f6bff' }
    ];
    var total = series.reduce(function (a, s) { return a + s.value; }, 0) || 1;
    var cx = c.w / 2, cy = 85, R = 62, r = 40;
    ctx.clearRect(0, 0, c.w, c.h);
    var a0 = -Math.PI / 2;
    series.forEach(function (s2) {
      var a1 = a0 + (s2.value / total) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(cx, cy, R, a0, a1);
      ctx.arc(cx, cy, r, a1, a0, true);
      ctx.closePath();
      ctx.fillStyle = s2.color; ctx.fill();
      // separador de 2px color superficie
      ctx.lineWidth = 2; ctx.strokeStyle = '#2a2b40'; ctx.stroke();
      a0 = a1;
    });
    ctx.fillStyle = '#f2f4f7'; ctx.font = '700 15px Inter, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(fmt(total), cx, cy + 1);
    ctx.fillStyle = '#7b87a0'; ctx.font = '10px Inter, sans-serif';
    ctx.fillText('ventas hoy', cx, cy + 15);
    drawDonutLegend();
  }
  function drawDonutLegend() {
    var lg = $('donutLegend');
    if (!lg) return;
    var series = [
      { label: 'Efectivo', value: S.mtd.efectivo, color: '#f59e0b' },
      { label: 'Tarjeta', value: S.mtd.tarjeta, color: '#2f6bff' }
    ];
    var total = series.reduce(function (a, s) { return a + s.value; }, 0) || 1;
    lg.innerHTML = series.map(function (s2) {
      var pct = Math.round(s2.value / total * 100);
      return '<div class="dl-row"><span class="dl-dot" style="background:' + s2.color + '"></span>' + s2.label +
        '<span class="dl-val">' + fmt(s2.value) + '</span><span class="dl-pct">' + pct + '%</span></div>';
    }).join('');
  }

  /* ═══ Ticket (réplica CobroExitoso + impresión ESC/POS) ═══ */
  function showTicket(titulo, num, o, metodo, recibido) {
    var total = itemsTotal(o.items);
    var f = new Date();
    var fecha = f.toLocaleDateString('es-SV') + ' ' + f.toLocaleTimeString('es-SV', { hour: '2-digit', minute: '2-digit' });
    var rows = o.items.map(function (it) {
      return '<tr><td>' + it.qty + ' ' + esc(it.name) + '</td><td>' + fmt(it.price * it.qty) + '</td></tr>';
    }).join('');
    var pago = metodo === 'efectivo'
      ? '<tr><td>EFECTIVO</td><td>' + fmt(recibido) + '</td></tr><tr><td>CAMBIO</td><td>' + fmt(recibido - total) + '</td></tr>'
      : '<tr><td>TARJETA</td><td>' + fmt(total) + '</td></tr>';
    $('overlayRoot').innerHTML =
      '<div class="overlay"><div class="ticket-wrap">' +
      '<span class="paid-check"><span class="pc-circle">' + ic('check') + '</span>Cobro registrado</span>' +
      '<span class="print-lbl">' + ic('printer') + 'Imprimiendo ticket (ESC/POS)…</span>' +
      '<div class="ticket"><h4>RESTAURANTE DEMO</h4>' +
      '<div class="tk-sub">Comprobante de venta · DEMO<br>San Salvador, El Salvador</div><hr>' +
      '<table><tr><td>Orden #' + num + '</td><td>' + esc(titulo) + '</td></tr>' +
      '<tr><td colspan="2">' + fecha + ' · Caja: Ana B.</td></tr></table><hr>' +
      '<table>' + rows + '<tr class="tk-total"><td>TOTAL</td><td>' + fmt(total) + '</td></tr>' + pago + '</table><hr>' +
      '<div class="tk-foot">IVA incluido<br>¡Gracias por su preferencia!</div>' +
      '<div class="tk-barcode" aria-hidden="true"></div></div>' +
      '<button class="btn btn-outline btn-block" id="btnCloseTicket">' + ic('check') + 'Listo — cerrar</button>' +
      '</div></div>';
    $('btnCloseTicket').addEventListener('click', function () {
      $('overlayRoot').innerHTML = '';
      render();
    });
  }

  /* ═══ Log de eventos ═══ */
  function showLog() {
    var items = S.events.slice().reverse().map(function (e) {
      var t = e.at.toLocaleTimeString('es-SV', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      return '<li><time>' + t + '</time><span><span class="ev">' + esc(e.ev) + '</span> ' + esc(e.detail) + '</span></li>';
    }).join('');
    $('overlayRoot').innerHTML =
      '<div class="overlay" id="logOverlay"><div class="modal log-modal">' +
      '<div class="log-h"><h3>Eventos en tiempo real — simulación de Laravel Reverb</h3>' +
      '<button class="icon-btn" id="btnCloseLog" style="width:36px;height:36px">' + ic('x', 'ic-sm') + '</button></div>' +
      '<ul>' + items + '</ul></div></div>';
    $('btnCloseLog').addEventListener('click', function () { $('overlayRoot').innerHTML = ''; });
    $('logOverlay').addEventListener('click', function (e) {
      if (e.target.id === 'logOverlay') $('overlayRoot').innerHTML = '';
    });
  }

  /* ═══ Intro ═══ */
  function showIntro() {
    $('overlayRoot').innerHTML =
      '<div class="overlay"><div class="modal intro">' +
      '<div class="intro-logo"><div class="logo-sq">' + ic('pizza') + '</div><div>' +
      '<h2>POS para restaurante</h2><p style="font-size:11px;color:var(--tm);letter-spacing:0.08em;text-transform:uppercase">Demo interactiva · datos simulados</p></div></div>' +
      '<p class="sub">Réplica del flujo real de operación del restaurante. Todo corre en tu navegador — nada se guarda.</p>' +
      '<div class="intro-steps">' +
      '<div class="intro-step"><span class="is-ic" style="background:rgba(var(--primary-rgb) / 0.15);color:var(--primary)">' + ic('utensils-crossed') + '</span><span><b>Mesero</b>Abrí una mesa, armá el pedido con el menú real y envialo a cocina.</span></div>' +
      '<div class="intro-step"><span class="is-ic" style="background:rgba(var(--danger-rgb) / 0.15);color:var(--danger)">' + ic('chef-hat') + '</span><span><b>Cocina (KDS)</b>La comanda llega al instante: tomala, preparala y marcala lista.</span></div>' +
      '<div class="intro-step"><span class="is-ic" style="background:rgba(var(--cash-rgb) / 0.15);color:var(--cash)">' + ic('banknote') + '</span><span><b>Caja</b>Cobrá en efectivo o tarjeta y mirá salir el ticket impreso.</span></div>' +
      '</div>' +
      '<p class="extra">También: <b>Repartidor</b> con bolsa común de deliveries y <b>Admin</b> con dashboard en vivo que refleja cada venta.</p>' +
      '<button class="btn btn-primary btn-block" id="btnStart">Empezar demo</button>' +
      '<p class="tech">Producto real: Laravel · Vue 3 + TypeScript · PostgreSQL · Reverb (WebSockets) · PWA offline-first · ESC/POS</p>' +
      '</div></div>';
    $('btnStart').addEventListener('click', function () { $('overlayRoot').innerHTML = ''; });
  }

  /* ═══ Barra móvil del pedido ═══ */
  function renderMbar() {
    var bar = $('mbar');
    var show = S.view === 'mesero' && S.meseroScreen === 'pedido' && S.activeTable;
    var o = show ? S.tables[S.activeTable].order : null;
    if (show && o && o.items.length) {
      $('mbarTxt').innerHTML = itemsCount(o.items) + ' ítems · <b class="tnum">' + fmt(itemsTotal(o.items)) + '</b>';
      var unsent = o.items.some(function (i) { return !i.sent; });
      $('mbarSend').disabled = !unsent;
      bar.classList.add('show');
    } else {
      bar.classList.remove('show');
    }
  }

  /* ═══ Acciones ═══ */
  function ensureOrder(n) {
    if (!S.tables[n].order) {
      S.dailySeq++;
      S.tables[n].order = { num: S.dailySeq, mesero: 'María G.', openedAt: Date.now(), cuenta: false, cuentaAt: null, listoAt: null, items: [] };
      pushEvent('ticket.created', 'Orden #' + S.dailySeq + ' · Mesa ' + n);
    }
    return S.tables[n].order;
  }
  function addItem(catI, prodI) {
    var it = MENU[catI].items[prodI];
    var o = ensureOrder(S.activeTable);
    var found = o.items.find(function (i) { return i.name === it[0] && !i.sent; });
    if (found) found.qty++;
    else o.items.push({ name: it[0], price: it[1], qty: 1, sent: false });
    S.flash = it[0];
    setTimeout(function () { if (S.flash === it[0]) { S.flash = null; render(); } }, 700);
  }
  function enviarCocina() {
    var n = S.activeTable;
    var o = S.tables[n] && S.tables[n].order;
    if (!o) return;
    var nuevos = o.items.filter(function (i) { return !i.sent; });
    if (!nuevos.length) return;
    var b = { id: ++batchSeq, num: o.num, table: n, status: 'pendiente', sentAt: Date.now(),
      items: nuevos.map(function (i) { return { name: i.name, qty: i.qty }; }) };
    S.batches.push(b);
    nuevos.forEach(function (i) { i.sent = true; });
    pushEvent('kitchen.batch.created', 'Orden #' + o.num + ' · Mesa ' + n + ' · ' + b.items.length + ' líneas');
    soundNewOrder();
    toast('Comanda enviada — sonó en cocina');
    render();
  }
  function cobrar() {
    var n = S.cajaCobro;
    var o = S.tables[n].order;
    var metodo = S.metodo;
    var recibido = metodo === 'efectivo' ? S.recibido : itemsTotal(o.items);
    var total = registerSale(o.items, metodo);
    pushEvent('ticket.paid', 'Orden #' + o.num + ' · Mesa ' + n + ' · ' + fmt(total) + ' · ' + metodo);
    showTicket('Mesa ' + n, o.num, o, metodo, recibido);
    S.batches = S.batches.filter(function (b) { return b.table !== n; });
    S.tables[n].order = null;
    S.cajaCobro = null;
    S.recibido = 0;
  }
  function findDelivery(id) { return S.deliveries.find(function (d) { return d.id === id; }); }

  /* ═══ Eventos de UI ═══ */
  document.querySelectorAll('.role-pill').forEach(function (p) {
    p.addEventListener('click', function () { S.view = p.dataset.view; S.sidebarOpen = false; render(); });
  });
  $('btnReset').addEventListener('click', function () {
    S = initialState();
    $('overlayRoot').innerHTML = '';
    pushEvent('demo.reset', 'estado inicial restaurado');
    render();
  });
  $('btnLog').addEventListener('click', showLog);
  $('mbarSend').addEventListener('click', enviarCocina);

  $('panel').addEventListener('input', function (e) {
    if (e.target.id === 'prodSearch') {
      S.search = e.target.value;
      var pos = e.target.selectionStart;
      render();
      var inp = $('prodSearch');
      if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
    }
  });

  $('panel').addEventListener('click', function (e) {
    var el = e.target.closest('button, tr[data-row]');
    if (!el) return;

    // mesero
    if (el.dataset.mesa) { S.activeTable = +el.dataset.mesa; S.meseroScreen = 'pedido'; S.activeCat = 0; S.search = ''; render(); return; }
    if (el.id === 'btnBack') { S.meseroScreen = 'mesas'; render(); return; }
    if (el.dataset.cat !== undefined) { S.activeCat = +el.dataset.cat; S.search = ''; render(); return; }
    if (el.dataset.add) {
      var parts = el.dataset.add.split(':');
      addItem(+parts[0], +parts[1]);
      render(); return;
    }
    if (el.dataset.inc !== undefined) { S.tables[S.activeTable].order.items[+el.dataset.inc].qty++; render(); return; }
    if (el.dataset.dec !== undefined) {
      var o = S.tables[S.activeTable].order;
      var item = o.items[+el.dataset.dec];
      if (item.qty > 1) item.qty--;
      else o.items.splice(+el.dataset.dec, 1);
      if (!o.items.length && !tableBatches(S.activeTable).length) S.tables[S.activeTable].order = null;
      render(); return;
    }
    if (el.id === 'btnEnviar') { enviarCocina(); return; }
    if (el.id === 'btnCuenta') {
      var oc = S.tables[S.activeTable].order;
      oc.cuenta = true; oc.cuentaAt = Date.now();
      pushEvent('ticket.account.requested', 'Mesa ' + S.activeTable + ' · ' + fmt(itemsTotal(oc.items)));
      toast('Cuenta solicitada — visible en Caja');
      render(); return;
    }

    // cocina
    if (el.dataset.take) {
      var bt = S.batches.find(function (b) { return b.id === +el.dataset.take; });
      if (bt) { bt.status = 'preparando'; pushEvent('kitchen.batch.taken', 'Orden #' + bt.num + ' · en preparación'); soundAdvance(); }
      render(); return;
    }
    if (el.dataset.ready) {
      var br = S.batches.find(function (b) { return b.id === +el.dataset.ready; });
      if (br) {
        br.status = 'listo';
        var ord = S.tables[br.table].order;
        if (ord && !ord.listoAt) ord.listoAt = Date.now();
        pushEvent('kitchen.batch.ready', 'Orden #' + br.num + ' · Mesa ' + br.table);
        soundAdvance();
        toast('Orden #' + br.num + ' lista — el mesero ya lo ve');
      }
      render(); return;
    }
    if (el.dataset.recall) {
      var bc = S.batches.find(function (b) { return b.id === +el.dataset.recall; });
      if (bc) {
        bc.status = bc.status === 'listo' ? 'preparando' : 'pendiente';
        pushEvent('kitchen.batch.recalled', 'Orden #' + bc.num + ' · ' + bc.status);
      }
      render(); return;
    }
    if (el.id === 'btnSound') { S.soundOn = !S.soundOn; if (S.soundOn) soundAdvance(); render(); return; }
    if (el.id === 'btnFs') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
      setTimeout(render, 120); return;
    }

    // caja
    if (el.dataset.cobrar || (el.dataset.row && cobrable(+el.dataset.row))) {
      var rn = +(el.dataset.cobrar || el.dataset.row);
      if (!cobrable(rn)) { toast('Orden aún en cocina'); return; }
      S.cajaCobro = rn; S.metodo = 'efectivo'; S.recibido = 0;
      render(); return;
    }
    if (el.dataset.row) { toast('Orden #' + S.tables[+el.dataset.row].order.num + ' aún en cocina'); return; }
    if (el.id === 'btnBackCaja') { S.cajaCobro = null; render(); return; }
    if (el.dataset.metodo) { S.metodo = el.dataset.metodo; render(); return; }
    if (el.dataset.quick) { S.recibido = +el.dataset.quick; render(); return; }
    if (el.dataset.key !== undefined) {
      var k = el.dataset.key;
      if (k === 'C') S.recibido = 0;
      else if (S.recibido < 100000) S.recibido = +(String(S.recibido) + k);
      render(); return;
    }
    if (el.id === 'btnPagar') { cobrar(); return; }
    if (el.dataset.liquidar) {
      var dl = findDelivery(el.dataset.liquidar);
      if (dl && dl.status === 'entregada') {
        var totL = registerSale(dl.items, 'efectivo');
        S.deliveries = S.deliveries.filter(function (d) { return d.id !== dl.id; });
        pushEvent('delivery.settled', dl.id + ' · ' + fmt(totL) + ' liquidado en caja');
        toast(dl.id + ' liquidado — ' + fmt(totL) + ' a caja');
      }
      render(); return;
    }

    // repartidor
    if (el.dataset.claim) {
      var dc = findDelivery(el.dataset.claim);
      if (dc && dc.status === 'pool') {
        dc.status = 'asignada';
        pushEvent('delivery.claimed', dc.id + ' · asignada a José D.');
        toast(dc.id + ' es tuya — claim atómico OK');
      }
      render(); return;
    }
    if (el.dataset.ruta) {
      var dr = findDelivery(el.dataset.ruta);
      if (dr && dr.status === 'asignada') { dr.status = 'en_camino'; pushEvent('delivery.status.updated', dr.id + ' · en camino'); }
      render(); return;
    }
    if (el.dataset.entregar) {
      var de = findDelivery(el.dataset.entregar);
      if (de && de.status === 'en_camino') {
        de.status = 'entregada';
        pushEvent('delivery.delivered', de.id + ' · ' + fmt(itemsTotal(de.items)));
        toast(de.id + ' entregada — liquidá el efectivo en Caja');
      }
      render(); return;
    }
    if (el.id === 'btnRiderRefresh') { toast('Sin cambios — Reverb ya te avisa en tiempo real'); return; }

    // admin
    if (el.id === 'btnSbOpen') { S.sidebarOpen = true; render(); return; }
    if (el.dataset.sbnav) {
      if (el.dataset.sbnav === 'dashboard') { S.adminNav = 'dashboard'; S.sidebarOpen = false; render(); }
      else toast('Solo Dashboard está activo en la demo');
      return;
    }
    if (el.id === 'btnDashRefresh') { render(); toast('Dashboard actualizado'); return; }
  });

  $('panel').addEventListener('click', function (e) {
    if (e.target.id === 'sbOverlay') { S.sidebarOpen = false; render(); }
  });

  // Atajos de caja (réplica: 1–9 selecciona, Enter abre)
  document.addEventListener('keydown', function (e) {
    if (S.view !== 'caja' || S.cajaCobro || $('overlayRoot').innerHTML) return;
    if (e.key >= '1' && e.key <= '9') {
      var rows = document.querySelectorAll('tr[data-row]');
      var row = rows[+e.key - 1];
      if (row) row.click();
    }
  });

  // Tick de 1 s: cronómetros KDS, reloj, sin re-render completo
  setInterval(function () {
    var clock = $('kdsClock');
    if (clock) clock.textContent = new Date().toLocaleTimeString('es-SV', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    document.querySelectorAll('.timer-pill[data-sent]').forEach(function (pill) {
      var sec = Math.floor((Date.now() - (+pill.dataset.sent)) / 1000);
      var status = pill.dataset.status;
      var tv = pill.querySelector('.tval');
      if (tv) tv.textContent = mmss(sec);
      var col = sec > 900 ? 'var(--danger)' : sec > 600 ? 'var(--warning)' : 'var(--ts)';
      var bg = sec > 900 ? 'rgba(var(--danger-rgb) / 0.15)' : sec > 600 ? 'rgba(var(--warning-rgb) / 0.15)' : 'rgba(255,255,255,0.06)';
      pill.style.color = col; pill.style.background = bg;
      var card = pill.closest('.kbatch');
      if (card) {
        var badge = card.querySelector('.kb-delayed');
        if (badge) badge.hidden = !(status !== 'listo' && sec > 900);
        if (sec >= 30) card.classList.remove('pulse-new');
      }
    });
  }, 1000);

  document.addEventListener('fullscreenchange', function () { if (S.view === 'cocina') render(); });

  /* ═══ Arranque ═══ */
  S = initialState();
  var last = S.events[S.events.length - 1];
  $('tickerMsg').innerHTML = '<span class="ev">' + esc(last.ev) + '</span> · ' + esc(last.detail);
  render();
  showIntro();
})();
</script>
</body>
</html>
